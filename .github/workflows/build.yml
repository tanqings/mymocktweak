name: Build MyMockTweak

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fakeroot dpkg-dev rsync perl curl pkg-config \
            libssl-dev libplist-dev

      - name: Build ldid from source
        run: |
          git clone --recursive https://github.com/ProcursusTeam/ldid.git /tmp/ldid
          make -C /tmp/ldid
          sudo make -C /tmp/ldid install PREFIX=/usr/local
          ldid -V 2>&1 || true

      - name: Clone Theos + SDKs
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          rm -rf "$HOME/theos/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git "$HOME/theos/sdks"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Show available SDKs
        run: ls -1 "$HOME/theos/sdks/"

      - name: Build package
        run: make package

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyMockTweak-deb
          path: packages/*.deb
          if-no-files-found: error
